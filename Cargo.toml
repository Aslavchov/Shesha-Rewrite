[workspace]
resolver = "3"
members = ["crates/contracts", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
contracts = { path = "crates/contracts" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps the keys of a stored form document in the order its
# author wrote them.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
# `macros` is on for `migrate!` (embedded migrations) only; queries use the
# runtime `query()` API, so no database is needed at build time.
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "smallvec", "std"] }
ts-rs = "12.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind": the server turns handler panics into a 500 response.
